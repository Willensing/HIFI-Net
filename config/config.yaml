model_params:
  optimizer: 'adam'
  lr: 0.0005
  epoch: 100
  con_alpha: 1

dataset_params:
  train_img_dir: ''
  train_mask_dir: ''
  train_edge_dir: ''

  val_img_dir: ''
  val_mask_dir: ''
  val_edge_dir: ''

  batch_size: 4
  im_size: 256
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

contrastive_params:
  temperature: 0.6
  p_len: 4
  in_out_weight: 0.3
  reliable_thresh: 0.05
  gamma: 2.0
